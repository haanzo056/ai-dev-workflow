name: ai-pr-reviewer
description: Reviews a pull request diff with Claude and posts the findings as review comments.
inputs:
  anthropic-api-key:
    description: Anthropic API key
    required: true
  github-token:
    description: Token with pull-requests:write
    default: ${{ github.token }}
  model:
    description: Model id
    default: claude-sonnet-5
  prompt-version:
    description: Prompt version from prompts/reviewer
    default: v3
  token-budget:
    description: Max tokens for the whole run
    default: "200000"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: install
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: npm ci --workspace @ai-dev-workflow/pr-reviewer --include-workspace-root
    - name: review
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REVIEWER_MODEL: ${{ inputs.model }}
        REVIEWER_PROMPT_VERSION: ${{ inputs.prompt-version }}
        REVIEWER_TOKEN_BUDGET: ${{ inputs.token-budget }}
      run: npx tsx src/cli.ts --pr "${{ github.repository }}#${{ github.event.pull_request.number }}" --post
